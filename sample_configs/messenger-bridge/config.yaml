# Sample config for mautrix-meta in Messenger mode (image tag `v0.2609.0`).
#
# The full commented config is generated by the image itself:
#   docker run --rm -v ${CONF_PATH}/messenger-bridge:/data:z dock.mau.dev/mautrix/meta:v0.2609.0
# This sample only shows the fields you must change for this stack.
#
# NOTE: the Messenger mode is baked into the plain image tag. The `ig-` tagged
# image (e.g. ig-v0.2609.0) bridges Instagram instead — that's a separate
# instance with its own config and registration.

# Network-specific config options.
network:
    # Displayname template for FB users.
    displayname_template: '{{or .DisplayName .Username "Unknown user"}}'

# Config for the bridge's database.
database:
    # The database type. "sqlite3-fk-wal" and "postgres" are supported.
    type: postgres
    # Create this database on the shared `db` container:
    #   docker exec -it db psql -U synapse -d synapse_db \
    #     -c "CREATE DATABASE messenger_bridge OWNER synapse;"
    uri: postgres://synapse:CHANGE_ME@db/messenger_bridge?sslmode=disable

# Homeserver details.
homeserver:
    # The address that this appservice can use to connect to the homeserver.
    # Plain HTTP over the shared Docker network — no TLS to verify.
    address: http://homeserver:8008
    # The domain of the homeserver (server_name, used for MXIDs, etc).
    domain: matrix.ms.local

    # What software is the homeserver running?
    software: standard

# Application service host/registration related details.
appservice:
    # The address that the homeserver can use to connect to this appservice.
    address: http://messenger-bridge:29331
    # For Docker, the hostname must be 0.0.0.0 (not localhost).
    hostname: 0.0.0.0
    port: 29331

    # The unique ID of this appservice.
    id: messenger
    # Appservice bot details.
    bot:
        username: messengerbot
        displayname: Messenger bridge bot

    # Localpart template of MXIDs for remote users.
    username_template: facebook_{{.}}

# Config options that affect the central bridge module.
bridge:
    # The prefix for commands. Only required in non-management rooms.
    command_prefix: '!fb'

    # Permissions for using the bridge.
    # Permitted values:
    #   relay    - Only use the bridge via the relaybot, no access to commands.
    #   user     - Relaybot level + access to commands to create bridges.
    #   puppeting - User level + logging in with a Messenger account.
    #   full     - Full access to use the bridge, i.e. previous levels + Matrix login.
    #   admin    - Full access to use the bridge and some extra administration commands.
    # Permitted keys:
    #   *        - All Matrix users
    #   domain   - All users on that homeserver
    #   mxid     - Specific user
    permissions:
        "*": relay
        "matrix.ms.local": full
        # "@admin:matrix.ms.local": admin

# End-to-bridge encryption support options.
encryption:
    # Allow encryption, work in group chat rooms with e2ee enabled.
    allow: true
    # Default to encryption, force-enable encryption in all portals the bridge creates.
    default: true