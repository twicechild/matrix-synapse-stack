# Sample config for maubot v0.6.x.
#
# The full commented config is generated by the image itself:
#   docker run --rm -v ${CONF_PATH}/maubot:/data:z dock.mau.dev/maubot/maubot:v0.6.0
# This sample only shows the fields you must change for this stack.

# The full URI to the database. SQLite and Postgres are fully supported.
# Format examples:
#   SQLite:   sqlite:///filename.db
#   Postgres: postgresql://username:password@hostname/dbname
database: sqlite:////data/maubot.db

# Separate database URL for the crypto database. "default" means use the same database as above.
crypto_db_pickle_key: mau.crypto
crypto_database: default

plugin_directories:
    # The directory where uploaded new plugins should be stored.
    upload: /data/plugins
    # The directories from which plugins should be loaded.
    # Duplicate plugin IDs will be moved to the trash.
    load:
    - /data/plugins
    # The directory where old plugin versions and conflicting plugins should be moved.
    # Set to "delete" to delete files immediately.
    trash: /data/trash
    # The directory where plugin databases should be stored.
    db: /data/dbs

server:
    # The IP and port to listen to.
    hostname: 0.0.0.0
    port: 29316
    # Public base URL where the server is visible.
    public_url: https://maubot.ms.local
    # The base path for the UI. Note that this does not change the API path.
    ui_base_path: /_matrix/maubot
    # The base path for plugin endpoints. The instance ID will be appended directly.
    plugin_base_path: /_matrix/maubot/plugin/
    # Override path from where to load UI resources.
    override_resource_path: /opt/maubot/frontend
    # The shared secret to sign API access tokens.
    # Set to "generate" to generate and save a new token at startup.
    unshared_secret: generate

# Known homeservers. This is required for the `mbc auth` command and also allows
# more convenient access from the management UI. This is not required to create
# clients in the management UI, since you can also just type the homeserver URL
# into the box there.
homeservers:
    matrix.ms.local:
        # Client-server API URL — plain HTTP over the shared Docker network.
        url: http://homeserver:8008
        # registration_shared_secret from homeserver.yaml
        # You can leave this empty if you don't have access to the homeserver.
        # When this is empty, `mbc auth --register` won't work, but `mbc auth` (login) will.
        secret: CHANGE_ME

# List of administrator users. Each key is a username and the value is the password.
# Plaintext passwords will be bcrypted on startup. Set empty password to prevent normal login.
# Root is a special user that can't have a password and will always exist.
admins:
    root: ""
    admin: CHANGE_ME

# API feature switches.
api_features:
    login: true
    plugin: true
    plugin_upload: true
    instance: true
    instance_database: true
    client: true
    client_proxy: true
    client_auth: true
    dev_open: true
    log: true

# Python logging configuration.
#
# See section 16.7.2 of the Python documentation for more info:
# https://docs.python.org/3.6/library/logging.config.html#configuration-dictionary-schema
logging:
    version: 1
    formatters:
        colored:
            (): maubot.lib.color_log.ColorFormatter
            format: '[%(asctime)s] [%(levelname)s@%(name)s] %(message)s'
        normal:
            format: '[%(asctime)s] [%(levelname)s@%(name)s] %(message)s'
    handlers:
        file:
            class: logging.handlers.RotatingFileHandler
            formatter: normal
            filename: /var/log/maubot.log
            maxBytes: 10485760
            backupCount: 10
        console:
            class: logging.StreamHandler
            formatter: colored
    loggers:
        maubot:
            level: DEBUG
        mau:
            level: DEBUG
        aiohttp:
            level: INFO
    root:
        level: DEBUG
        handlers: [file, console]