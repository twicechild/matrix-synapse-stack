# Sample config for mautrix-telegram v0.26.x (Go / bridgev2 architecture).
#
# The full commented config is generated by the image itself:
#   docker run --rm -v ${CONF_PATH}/telegram-bridge:/data:z dock.mau.dev/mautrix/telegram:v0.2609.0
# This sample only shows the fields you must change for this stack.

# Network-specific config (was `telegram:` in the old Python bridge).
network:
    # Get your own API keys at https://my.telegram.org/apps
    api_id: 12345
    api_hash: tjyd5yge35lbodk1xwzw2jstp90k55qz

# Config for the bridge's database.
database:
    # The database type. "sqlite3-fk-wal" and "postgres" are supported.
    type: postgres
    # Create this database on the shared `db` container:
    #   docker exec -it db psql -U synapse -d synapse_db \
    #     -c "CREATE DATABASE telegram_bridge OWNER synapse;"
    uri: postgres://synapse:CHANGE_ME@db/telegram_bridge?sslmode=disable

# Homeserver details.
homeserver:
    # The address that this appservice can use to connect to the homeserver.
    # Plain HTTP over the shared Docker network — no TLS to verify.
    address: http://homeserver:8008
    # The domain of the homeserver (server_name, used for MXIDs, etc).
    domain: matrix.ms.local

    # What software is the homeserver running?
    software: standard

# Application service host/registration related details.
appservice:
    # The address that the homeserver can use to connect to this appservice.
    address: http://telegram-bridge:29317
    # For Docker, the hostname must be 0.0.0.0 (not localhost).
    hostname: 0.0.0.0
    port: 29317

    # The unique ID of this appservice.
    id: telegram
    # Appservice bot details.
    bot:
        username: telegrambot
        displayname: Telegram bridge bot

    # Localpart template of MXIDs for remote users.
    username_template: telegram_{{.}}

# Config options that affect the central bridge module.
bridge:
    # The prefix for commands. Only required in non-management rooms.
    command_prefix: '!tg'

    # Permissions for using the bridge.
    # Permitted values:
    #   relay    - Talk through the relaybot (if enabled), no access otherwise.
    #   commands - Access to use commands in the bridge, but not login.
    #   user     - Access to use the bridge with puppeting.
    #   admin    - Full access, user level with some additional administration tools.
    # Permitted keys:
    #   *        - All Matrix users
    #   domain   - All users on that homeserver
    #   mxid     - Specific user
    permissions:
        "*": relay
        "matrix.ms.local": user
        # "@admin:matrix.ms.local": admin

# End-to-bridge encryption support options.
# Requires the `matrix` network on the homeserver listener and a pickle key that
# persists across restarts (it does — /data is a mounted volume).
encryption:
    # Allow encryption, work in group chat rooms with e2ee enabled.
    allow: true
    # Default to encryption, force-enable encryption in all portals the bridge creates.
    default: true