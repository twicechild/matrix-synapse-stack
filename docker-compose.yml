name: matrix-synapse-stack

networks:
  proxy:
  db:
  bots:

volumes:
  db-data:

services:
  ## PROXY
  proxy:
    image: traefik:v3.7.13
    container_name: proxy
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/ssl.toml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --api.dashboard=true
      - --log.level=INFO
    volumes:
      - ${CONF_PATH}/proxy/traefik-ssl.toml:/etc/traefik/ssl.toml:ro
      - ${CERT_PATH}:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # Dashboard router — protected by the dashboard-auth middleware below.
      # Set the user:password with `htpasswd -nb user 'password'` (bcrypt needs htpasswd >= 2.4 or apache2-utils).
      - traefik.http.routers.proxy-dashboard.rule=Host(`proxy.${DOMAIN}`)
      - traefik.http.routers.proxy-dashboard.service=api@internal
      - traefik.http.routers.proxy-dashboard.middlewares=dashboard-auth
      - traefik.http.routers.proxy-dashboard.tls=true
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USER:-admin}:${TRAEFIK_DASHBOARD_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  ## DATABASE
  db:
    image: postgres:17.11-trixie
    container_name: db
    restart: always
    env_file:
      - db.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db

  ## HOMESERVER
  homeserver:
    image: matrixdotorg/synapse:v1.98.0
    container_name: homeserver
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - synapse.env
    volumes:
      - ${CONF_PATH}/homeserver:/data
      - ${DATA_PATH}/homeserver-media-store:/media_store
      - ${CERT_PATH}:/certs:ro
      - ${CONF_PATH}/telegram-bridge/registration.yaml:/app_services/telegram-registration.yaml:ro
      - ${CONF_PATH}/instagram-bridge/registration.yaml:/app_services/instagram-registration.yaml:ro
      - ${CONF_PATH}/messenger-bridge/registration.yaml:/app_services/messenger-registration.yaml:ro
      - ${CONF_PATH}/hookshot/registration.yml:/app_services/hookshot-registration.yml:ro
    networks:
      - db
      - proxy
      - bots
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.homeserver.rule=Host(`matrix.${DOMAIN}`)
      - traefik.http.routers.homeserver.service=homeserver
      - traefik.http.routers.homeserver.middlewares=homeserver-headers
      - traefik.http.routers.homeserver.tls=true
      - traefik.http.services.homeserver.loadbalancer.server.port=8008
      - traefik.http.middlewares.homeserver-headers.headers.customrequestheaders.X-Forwarded-Proto=https
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ## ELEMENT WEB CLIENT
  webchat:
    image: vectorim/element-web:v1.12.28
    container_name: webchat
    restart: always
    depends_on:
      - homeserver
    volumes:
      - ${CONF_PATH}/webchat/config.json:/usr/share/nginx/html/config.json:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.webchat.rule=Host(`webchat.${DOMAIN}`)
      - traefik.http.routers.webchat.service=webchat
      - traefik.http.routers.webchat.tls=true
      - traefik.http.services.webchat.loadbalancer.server.port=8080

  ## SYNAPSE ADMIN
  admin:
    image: awesometechnologies/synapse-admin:0.11.4
    container_name: admin
    restart: always
    depends_on:
      - homeserver
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.admin.rule=Host(`admin.${DOMAIN}`)
      - traefik.http.routers.admin.service=admin
      - traefik.http.routers.admin.tls=true
      - traefik.http.services.admin.loadbalancer.server.port=80

  ## BRIDGES
  telegram-bridge:
    image: dock.mau.dev/mautrix/telegram:v0.2609.0
    container_name: telegram-bridge
    restart: always
    depends_on:
      homeserver:
        condition: service_healthy
    volumes:
      - ${CONF_PATH}/telegram-bridge:/data
    networks:
      - bots
      - db
    labels:
      - traefik.enable=false

  instagram-bridge:
    image: dock.mau.dev/mautrix/meta:ig-v0.2609.0
    container_name: instagram-bridge
    restart: always
    depends_on:
      homeserver:
        condition: service_healthy
    volumes:
      - ${CONF_PATH}/instagram-bridge:/data
    networks:
      - bots
      - db
    labels:
      - traefik.enable=false

  messenger-bridge:
    image: dock.mau.dev/mautrix/meta:v0.2609.0
    container_name: messenger-bridge
    restart: always
    depends_on:
      homeserver:
        condition: service_healthy
    volumes:
      - ${CONF_PATH}/messenger-bridge:/data
    networks:
      - bots
      - db
    labels:
      - traefik.enable=false

  ## WEBHOOKS + INTEGRATIONS
  hookshot:
    image: ghcr.io/matrix-org/matrix-hookshot:7.4.4
    container_name: hookshot
    restart: always
    depends_on:
      homeserver:
        condition: service_healthy
    volumes:
      - ${CONF_PATH}/hookshot:/data
    networks:
      - bots
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Webhook receiver — external services POST here.
      - traefik.http.routers.hookshot-webhooks.rule=Host(`webhooks.${DOMAIN}`)
      - traefik.http.routers.hookshot-webhooks.service=hookshot-webhooks
      - traefik.http.routers.hookshot-webhooks.tls=true
      - traefik.http.services.hookshot-webhooks.loadbalancer.server.port=9000

  ## BOTS
  maubot:
    image: dock.mau.dev/maubot/maubot:v0.6.0
    container_name: maubot
    restart: always
    depends_on:
      homeserver:
        condition: service_healthy
    volumes:
      - ${CONF_PATH}/maubot:/data
    networks:
      - bots
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.maubot.rule=Host(`maubot.${DOMAIN}`)
      - traefik.http.routers.maubot.service=maubot
      - traefik.http.routers.maubot.tls=true
      - traefik.http.services.maubot.loadbalancer.server.port=29316